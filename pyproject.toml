[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recsys"
version = "0.1.0"
description = "Two-stage movie recommender with a from-scratch HNSW index"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "scipy>=1.11",
    "implicit>=0.7",
    "threadpoolctl>=3",
    "lightgbm>=4",
]

[project.optional-dependencies]
serve = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "cmake>=3.16", "pybind11>=2.12", "fastapi>=0.110", "httpx>=0.27"]
bench = ["faiss-cpu>=1.8", "matplotlib>=3.8", "httpx>=0.27", "uvicorn>=0.29"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
